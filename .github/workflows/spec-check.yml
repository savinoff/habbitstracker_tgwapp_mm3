name: spec-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  spec-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run spec-check (TЗ ↔ code traceability)
        run: node scripts/spec-check.js

      - name: Install server deps
        run: npm --prefix server install --no-audit --no-fund

      - name: Run db migration smoke test
        env:
          TELEGRAM_BOT_TOKEN: test-token
          OWNER_TELEGRAM_ID: '1'
        run: node scripts/test-db.js

      - name: Summary
        if: always()
        run: echo "spec-check finished with status ${{ job.status }}"
