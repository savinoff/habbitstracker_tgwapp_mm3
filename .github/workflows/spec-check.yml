name: spec-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  spec-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run spec-check
        run: node scripts/spec-check.js

      - name: Summary
        if: always()
        run: echo "spec-check finished with status ${{ job.status }}"
