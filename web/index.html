<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>HabitsTracker</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <!--
      Telegram WebApp SDK. Загружаем до main.js, чтобы window.Telegram.WebApp
      был доступен сразу. spec:06-ui-states.md#q8 — загрузка с CDN.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1 class="app-title">HabitsTracker</h1>
      </header>

      <main id="screen" class="screen" aria-live="polite">
        <!-- сюда рендерится активный экран -->
      </main>

      <nav id="tabbar" class="tabbar" role="tablist" aria-label="Разделы">
        <button class="tab" data-tab="home" role="tab" aria-selected="true">
          <span class="tab__icon" aria-hidden="true">🏠</span>
          <span class="tab__label">Главная</span>
        </button>
        <button class="tab" data-tab="history" role="tab" aria-selected="false">
          <span class="tab__icon" aria-hidden="true">📜</span>
          <span class="tab__label">История</span>
        </button>
        <button class="tab" data-tab="settings" role="tab" aria-selected="false">
          <span class="tab__icon" aria-hidden="true">⚙️</span>
          <span class="tab__label">Настройки</span>
        </button>
      </nav>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
