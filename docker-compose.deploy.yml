# docker-compose.deploy.yml — production compose file.
#
# Использование на VPS (после setup-vps.sh):
#   cd /opt/habitstracker
#   cp .env.example .env  (заполнить TELEGRAM_BOT_TOKEN, OWNER_TELEGRAM_ID,
#                          APP_BASE_URL, CADDY_EMAIL, опционально WEBHOOK_URL)
#   docker compose -f docker-compose.deploy.yml --env-file .env build
#   docker compose -f docker-compose.deploy.yml --env-file .env up -d
#
# Два сервиса:
#   * caddy — reverse proxy + ACME (Let's Encrypt) + auto-renewal.
#             Внутри делает подстановку {$APP_BASE_URL} и {$CADDY_EMAIL}.
#   * api   — Fastify-приложение + статика web/dist + scheduler + бот.
#             Не публикует порт наружу; caddy ходит к нему через
#             внутреннюю docker-сеть.
#
# Тома:
#   * /var/lib/habitstracker    — habits.db (api)
#   * /var/backups/habitstracker — бэкапы (api, через cron на хосте)
#   * caddy_data               — ACME-сертификаты (named volume)
#   * caddy_config             — admin API state (named volume)
#
# spec:08-deploy.md#q2, q3, q9

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: habitstracker:latest
    container_name: habitstracker-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/habits.db
      - STATIC_DIR=/app/web/dist
      - NODE_ENV=production
    volumes:
      - /var/lib/habitstracker:/data
      - /var/backups/habitstracker:/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    expose:
      - "3000"
    # ВАЖНО: не публикуем порт 3000 наружу. Caddy подключается к нему
    # через docker network 'habitstracker-net' (см. networks ниже).

  caddy:
    build:
      context: ./caddy
    image: habitstracker-caddy:latest
    container_name: habitstracker-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      # spec:08-deploy.md#q13
      # v0.3.0: Caddy слушает 443 внутри контейнера, наружу пробрасывается
      # на 8443 — для случая, когда 443 на хосте уже занят другим сервисом
      # (X-UI, Outline, провайдерский nginx). Если 443 свободен — поменять
      # на "443:443".
      - "8443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Caddy внутри: на старте entrypoint.sh делает envsubst и пишет
    # /etc/caddy/Caddyfile, затем caddy run.
    # spec:08-deploy.md#q11

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    name: habitstracker-net
