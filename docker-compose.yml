# docker-compose.yml — dev-стэк: api (с раздачей статики из web/dist) и больше ничего.
#
# v0.3.0: в проде используем docker-compose.deploy.yml + Caddy (см. README → "Деплой").
# Этот файл — для локальной разработки без TLS и без Caddy.
#
# Управление через Portainer или docker compose CLI.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habitstracker-api-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # STATIC_DIR=/app/web/dist — нужно, чтобы api раздавал web/dist (см. 05-api.md#q10).
      # DATABASE_PATH=/data/habits.db — файл SQLite (внутри контейнера).
      - DATABASE_PATH=/data/habits.db
      - STATIC_DIR=/app/web/dist
    volumes:
      # dev: используем named volumes, чтобы данные не потерялись между рестартами.
      - habits-data:/data
      - habits-backups:/backups
    ports:
      # 127.0.0.1:3000 — чтобы не светить 3000 наружу; для проверки через Caddy/ngrok
      # или прямой http://localhost:3000.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  habits-data:
  habits-backups:
